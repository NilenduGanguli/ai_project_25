services:
  ocr-service:
    build: .
    image: ocr-service
    container_name: ocr-service
    ports:
      - "${PORT:-8006}:${PORT:-8006}"
    environment:
      - PORT=${PORT:-8006}
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONPATH=/app
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; urllib.request.urlopen(f'http://localhost:{os.environ.get(\"PORT\",8006)}/')",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - citi-intern-network

networks:
  citi-intern-network:
    external: true
